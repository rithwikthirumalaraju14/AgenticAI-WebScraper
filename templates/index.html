<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Web Crawler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <h1>🌌 AI Tech-Support Agent</h1>

        <!-- Crawl Form -->
        <form action="/crawl" method="POST" class="glassmorphic-card" aria-label="Crawl Form">
            <input type="url" name="url" placeholder="Enter website URL..." required pattern="https?://.+">
            <button type="submit" aria-label="Start Crawling">🚀 Crawl</button>
        </form>

        <!-- Query Form -->
        <form action="/query" method="POST" class="glassmorphic-card" aria-label="Query Form">
            <input type="text" name="query" placeholder="Ask a question..." required>
            <button type="submit" aria-label="Search Query">🔍 Search</button>
        </form>

        <!-- Voice Form -->
        <form action="/voice" method="POST" class="glassmorphic-card" aria-label="Voice Form">
            <label for="input">Select Input Language:</label>
            <select name="input" id="input" required>
                <option value="None">None</option>
                <option value="english">English</option>
                <option value="telugu">Telugu</option>
                <option value="hindi">Hindi</option>
            </select>

            <br><br>

            <label for="output">Select Output Language:</label>
            <select name="output" id="output" required>
                <option value="None">None</option>
                <option value="english">English</option>
                <option value="telugu">Telugu</option>
                <option value="hindi">Hindi</option>
            </select>

            <br><br>

            <label for="accent">Select Accent:</label>
            <select name="accent" id="accent" required>
                <option value="None">None</option>
                <option value="british">British</option>
                <option value="american">American</option>
                <option value="indian">Indian</option>
                <option value="korean">Korean</option>
                <option value="german">German</option>
            </select>
            <button type="submit" class="mic-btn" aria-label="Speak">🎙 Speak</button>
        </form>

        <!-- Website Creation Form -->
        <form action="/website" method="POST" class="glassmorphic-card" aria-label="Website Creation Form">
            <button type="submit" aria-label="Create Website">Website Creation</button>
        </form>

        {% if message %}
        <div class="output-box">{{ message }}</div>
        {% endif %}
    </div>

    <div class="output">
        {% if response %}
        <div class="output-box neon">{{ response }}</div>
        {% endif %}
    </div>

    <div class="cont">
        <!-- Visualization Form -->
        <form action="/plot" method="POST" class="glass-card" aria-label="Visualization Form">
            <input type="text" name="input" placeholder="Visualize the data" required>
            <button type="submit" aria-label="Visualize Data">🚀 Visual</button>
        </form>

        <!-- Iframe for Visualization -->
        <!-- <iframe id="miniFrame" width="100%" height="500px" frameborder="0" title="Visualization Output"></iframe> -->
        {% if image_exists %}
        <a href="{{ url_for('static', filename='plot.html') }}" target="_blank" title="View Full Visualization">
            <img id="miniFrame" src="{{ url_for('static', filename='plot.png') }}" alt="Visualization Preview" width="500px" height="500px">
        </a>
        {% endif %}
    </div>
</body>

</html>
